// Cada aba recebe dias inteiros; um dia que já existe na planilha não é regravado.
const ABAS = [
  { aba: 'Condenacao', nome: 'Condenação', linhas: PK.condenacao },
  { aba: 'Miudos', nome: 'Miúdos', linhas: PK.miudos },
  { aba: 'Carcaca', nome: 'Carcaça', linhas: PK.carcaca },
];
const d10 = v => String(v ?? '').slice(0, 10);
const isD = v => /^\d{4}-\d{2}-\d{2}/.test(String(v ?? ''));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
function log(t, cls) { const el = document.getElementById('log'); const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = t; el.appendChild(d); el.scrollTop = el.scrollHeight; }
async function call(action, data) {
  const url = document.getElementById('url').value.trim();
  if (!url.startsWith('https://script.google.com')) throw new Error('URL do Apps Script inválida');
  const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, ...data }) });
  const text = await resp.text(); let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('Resposta não era JSON: ' + text.slice(0, 200)); }
  if (!j.ok) throw new Error(j.error || 'Erro no servidor');
  return j;
}
const ler = async aba => (await call('read', { sheet: aba })).values || [];

let PLANO = null;
async function montarPlano() {
  log('Lendo a planilha atual...');
  const plano = [];
  for (const a of ABAS) {
    const atual = await ler(a.aba);
    const dias = new Set(atual.filter(r => isD(r[0])).map(r => d10(r[0])));
    const novas = a.linhas.filter(r => !dias.has(r[0]));
    const pulados = [...new Set(a.linhas.filter(r => dias.has(r[0])).map(r => r[0]))];
    plano.push({ ...a, novas, pulados });
  }
  return plano;
}
function mostrarResumo(plano) {
  document.getElementById('resumo').innerHTML = '<table><tr><th>O que vai entrar</th><th class="r">Qtd</th></tr>' +
    plano.map(p => `<tr><td>${p.nome}</td><td class="r">${new Set(p.novas.map(r => r[0])).size} dias (${p.novas.length} linhas)</td></tr>`).join('') + '</table>';
  plano.forEach(p => { if (p.pulados.length) log(`⚠ ${p.nome}: dias que já estavam na planilha e não serão regravados: ${p.pulados.join(', ')}`, 'warn'); });
}
async function conferir() {
  document.getElementById('log').innerHTML = '';
  const bc = document.getElementById('btnConf'), bg = document.getElementById('btnGrav');
  bc.disabled = true; bg.disabled = true;
  try { PLANO = await montarPlano(); mostrarResumo(PLANO); log('✓ Conferência pronta. Nada foi gravado. Se o resumo estiver ok, clique em "2. Gravar".', 'ok'); bg.disabled = false; }
  catch (e) { log('✕ ERRO: ' + e.message, 'err'); }
  bc.disabled = false;
}
async function gravar() {
  if (!PLANO) return;
  if (!confirm('Gravar as alterações na planilha agora?')) return;
  const bc = document.getElementById('btnConf'), bg = document.getElementById('btnGrav');
  bc.disabled = true; bg.disabled = true;
  try {
    const plano = await montarPlano();  // relê a planilha: grava só o que ainda falta
    for (const p of plano) {
      if (!p.novas.length) continue;
      log(`${p.nome}: adicionando ${p.novas.length} linha(s)...`);
      await call('append', { sheet: p.aba, values: p.novas });
      log('  ✓', 'ok');
    }
    await verificar();
  } catch (e) { log('✕ ERRO: ' + e.message, 'err'); alert('✕ Erro: ' + e.message + '\n\nMande o log para o Claude.'); }
  bc.disabled = false;
}
async function verificar() {
  log('Conferindo o resultado direto na planilha...');
  const erros = [];
  for (const a of ABAS) {
    const atual = (await ler(a.aba)).filter(r => isD(r[0]));
    const esperado = new Map(); a.linhas.forEach(r => esperado.set(r[0], (esperado.get(r[0]) || 0) + 1));
    const tem = new Map(); atual.forEach(r => { const d = d10(r[0]); if (esperado.has(d)) tem.set(d, (tem.get(d) || 0) + 1); });
    for (const [d, n] of esperado) if (tem.get(d) !== n) erros.push(`${a.nome} ${d}: esperado ${n} linhas, tem ${tem.get(d) || 0}`);
    if (a.aba === 'Miudos') {
      const idx = new Map(atual.map(r => [d10(r[0]) + '|' + String(r[1]).trim(), r]));
      a.linhas.forEach(e => { const r = idx.get(e[0] + '|' + e[1]); if (!r || Math.abs(num(r[3]) - e[3]) > 0.001 || Math.abs(num(r[4]) - e[4]) > 0.01) erros.push(`Miúdos ${e[0]} ${e[1]}: valor diferente do arquivo`); });
    }
    const corr = atual.filter(r => esperado.has(d10(r[0])) && r.slice(2).some(v => isD(v))).length;
    if (corr) erros.push(`${a.nome}: ${corr} linha(s) com número virando data`);
  }
  if (erros.length) { erros.slice(0, 30).forEach(e => log('✕ ' + e, 'err')); log('✕ A conferência final encontrou problemas — mande este log para o Claude.', 'err'); alert('⚠ A conferência encontrou ' + erros.length + ' problema(s). Mande o log para o Claude.'); }
  else { log('✓ TUDO CONFERIDO: todos os dias novos gravados, sem duplicatas e sem corrupção.', 'ok'); alert('✓ Importação concluída e conferida.'); }
}

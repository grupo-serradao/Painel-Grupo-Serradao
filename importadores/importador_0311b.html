  const abK = new Set(L.Abates.filter(r => isD(r[0])).map(r => d10(r[0]) + '|' + String(r[1]).trim()));
  p.abates = PK.abates.filter(r => !abK.has(r[0] + '|' + r[1]));
  const peD = new Set(L.Pesos.map(r => dataDe(r[1])).filter(Boolean));
  p.pesos = PK.pesos.filter(r => !peD.has(r[1]));
  const taK = new Set(L.TempoAbate.filter(r => isD(r[0])).map(r => d10(r[0]) + '|' + norm(r[1])));
  p.ta = PK.tempoabate.filter(r => !taK.has(r[0] + '|' + norm(r[1])));
  const miD = new Set(L.Miudos.filter(r => isD(r[0])).map(r => d10(r[0])));
  p.miudos = PK.miudos.filter(r => !miD.has(r[0]));
  const caD = new Set(L.Carcaca.filter(r => isD(r[0])).map(r => d10(r[0])));
  p.carcaca = PK.carcaca.filter(r => !caD.has(r[0]));
  const paLive = L.Paradas.filter(r => isD(r[0]));
  const pkD = new Set(PK.paradas.slice(1).map(r => r[0]));
  const fora = [...new Set(paLive.map(r => d10(r[0])))].filter(d => !pkD.has(d));
  p.paAtual = paLive.length; p.paNovo = PK.paradas.length - 1; p.paBloq = fora.length > 0;
  if (p.paBloq) p.avisos.push(`Paradas: a planilha tem datas que não estão no Excel (${fora.slice(0, 5).join(', ')}) — Paradas NÃO será sobrescrita`);
  return p;
}
function mostrarResumo(p) {
  const dias = rs => new Set(rs.map(r => r[0] || r[1])).size;
  const linhas = [
    ['Abates — linhas novas', `${dias(p.abates)} dias (${p.abates.length} linhas)`],
    ['Pesos — dias novos', `${p.pesos.length}`],
    ['Tempo de abate — linhas novas', `${dias(p.ta)} dias (${p.ta.length} linhas)`],
    ['Paradas — aba inteira passa a ser a do Excel', p.paBloq ? 'bloqueado' : `${p.paAtual} → ${p.paNovo} registros`],
    ['Miúdos — 23/09', `${p.miudos.length} linhas`],
    ['Carcaça — 23/09', `${p.carcaca.length} linhas`],
  ];
  document.getElementById('resumo').innerHTML = '<table><tr><th>O que vai mudar</th><th class="r">Qtd</th></tr>' + linhas.map(([a, b]) => `<tr><td>${a}</td><td class="r">${b}</td></tr>`).join('') + '</table>';
  p.avisos.forEach(a => log('⚠ ' + a, 'warn'));
}
async function conferir() {
  document.getElementById('log').innerHTML = '';
  const bc = document.getElementById('btnConf'), bg = document.getElementById('btnGrav');
  bc.disabled = true; bg.disabled = true;
  try { PLANO = await montarPlano(); mostrarResumo(PLANO); log('✓ Conferência pronta. Nada foi gravado. Se o resumo estiver ok, clique em "2. Gravar".', 'ok'); bg.disabled = false; }
  catch (e) { log('✕ ERRO: ' + e.message, 'err'); }
  bc.disabled = false;
}
async function gravar() {
  if (!PLANO) return;
  if (!confirm('Gravar as alterações na planilha agora?')) return;
  const bc = document.getElementById('btnConf'), bg = document.getElementById('btnGrav');
  bc.disabled = true; bg.disabled = true;
  try {
    const p = await montarPlano();  // relê a planilha: grava só o que ainda falta
    const add = async (aba, nome, rs) => { if (!rs.length) return; log(`${nome}: adicionando ${rs.length} linha(s)...`); await call('append', { sheet: aba, values: rs }); log('  ✓', 'ok'); };
    await add('Abates', 'Abates', p.abates);
    await add('Pesos', 'Pesos', p.pesos);
    await add('TempoAbate', 'Tempo de abate', p.ta);
    await add('Miudos', 'Miúdos', p.miudos);
    await add('Carcaca', 'Carcaça', p.carcaca);
    if (!p.paBloq) {
      log(`Paradas: gravando ${p.paNovo} registros (versão do Excel)...`);
      const r = await call('overwrite', { sheet: 'Paradas', values: PK.paradas });
      if (r.totalNaAba !== PK.paradas.length) throw new Error(`Paradas: esperado ${PK.paradas.length} linhas na aba, servidor diz ${r.totalNaAba}`);
      log('  ✓', 'ok');
    }
    // Na aba Pesos a data fica na coluna B; com o Apps Script antigo (v2.4) ela vira número ao gravar. Regrava como data.
    const pe = await ler('Pesos'), novas = new Set(PK.pesos.map(r => r[1]));
    const cells = []; pe.forEach((r, i) => { if (typeof r[1] === 'number' && novas.has(dataDe(r[1]))) cells.push({ row: i + 1, col: 2, expected: r[1], value: dataDe(r[1]) }); });
    if (cells.length) { log(`Pesos: corrigindo ${cells.length} data(s) que viraram número...`); await call('update', { sheet: 'Pesos', cells }); log('  ✓', 'ok'); }
    await verificar(p);
  } catch (e) { log('✕ ERRO: ' + e.message, 'err'); alert('✕ Erro: ' + e.message + '\n\nMande o log para o Claude.'); }
  bc.disabled = false;
}
async function verificar(p) {
  log('Conferindo o resultado direto na planilha...');
  const L = {}; for (const a of ['Abates', 'Pesos', 'TempoAbate', 'Paradas', 'Miudos', 'Carcaca']) L[a] = await ler(a);
  const erros = [];
  const cont = (rs, f) => { const m = new Map(); rs.forEach(r => { const k = f(r); if (k) m.set(k, (m.get(k) || 0) + 1); }); return m; };
  const ab = cont(L.Abates.filter(r => isD(r[0])), r => d10(r[0]) + '|' + String(r[1]).trim());
  PK.abates.forEach(r => { const n = ab.get(r[0] + '|' + r[1]); if (n !== 1) erros.push(`Abates ${r[0]} ${r[1]}: ${n || 0} linhas`); });
  const pe = cont(L.Pesos, r => isD(r[1]) ? d10(r[1]) : (typeof r[1] === 'number' ? 'NUM:' + dataDe(r[1]) : null));
  PK.pesos.forEach(r => { if (pe.get(r[1]) !== 1) erros.push(`Pesos ${r[1]}: ${pe.get(r[1]) || 0} linhas com data${pe.get('NUM:' + r[1]) ? ' (data ainda como número)' : ''}`); });
  const ta = cont(L.TempoAbate.filter(r => isD(r[0])), r => d10(r[0]) + '|' + norm(r[1]));
  PK.tempoabate.forEach(r => { const n = ta.get(r[0] + '|' + norm(r[1])); if (n !== 1) erros.push(`Tempo de abate ${r[0]} ${r[1]}: ${n || 0} linhas`); });
  for (const [k, n] of ta) if (n > 1) erros.push(`Tempo de abate duplicado: ${k}`);
  const mi = cont(L.Miudos.filter(r => isD(r[0])), r => d10(r[0])), ca = cont(L.Carcaca.filter(r => isD(r[0])), r => d10(r[0]));
  if (mi.get('2026-09-23') !== PK.miudos.length) erros.push(`Miúdos 23/09: ${mi.get('2026-09-23') || 0} linhas`);
  if (ca.get('2026-09-23') !== PK.carcaca.length) erros.push(`Carcaça 23/09: ${ca.get('2026-09-23') || 0} linhas`);
  if (!p.paBloq) { const n = L.Paradas.filter(r => isD(r[0])).length; if (n !== p.paNovo) erros.push(`Paradas: esperado ${p.paNovo}, tem ${n}`); }
  if (erros.length) { erros.slice(0, 30).forEach(e => log('✕ ' + e, 'err')); log('✕ A conferência final encontrou problemas — mande este log para o Claude.', 'err'); alert('⚠ A conferência encontrou ' + erros.length + ' problema(s). Mande o log para o Claude.'); }
  else { log('✓ TUDO CONFERIDO: dados novos gravados, sem duplicatas, datas certas.', 'ok'); alert('✓ Importação concluída e conferida.'); }
}

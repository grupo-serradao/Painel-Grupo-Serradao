    const res = await analisar();
    const por = {};
    res.forEach(r => { const k = r.c.aba; por[k] = por[k] || { aplicar: 0, ja: 0, diverge: 0 }; por[k][r.st]++; });
    document.getElementById('resumo').innerHTML = '<table><tr><th>Aba</th><th class="r">A corrigir</th><th class="r">Já corrigidas</th><th class="r">Divergentes</th></tr>' +
      Object.entries(por).map(([k, v]) => `<tr><td>${k}</td><td class="r">${v.aplicar}</td><td class="r">${v.ja}</td><td class="r">${v.diverge}</td></tr>`).join('') + '</table>';
    const mot = {};
    res.filter(r => r.st === 'aplicar' && r.c.aba !== 'Miudos').forEach(r => log('  ' + rot(r.c) + '  — ' + r.c.motivo));
    const nm = res.filter(r => r.st === 'aplicar' && r.c.aba === 'Miudos').length;
    if (nm) log(`  Miudos: ${nm} células (kg total do abate e % real recalculados; 08/02 → 07/02)`);
    const div = res.filter(r => r.st === 'diverge');
    div.forEach(r => log('DIVERGE: ' + rot(r.c) + ' — ' + r.msg, 'err'));
    const n = res.filter(r => r.st === 'aplicar').length;
    if (div.length) log('Há divergências: nada será gravado. Me mande este registro.', 'err');
    else if (!n) log('✓ Todas as correções já estão na planilha. Nada a fazer.', 'ok');
    else { log(`Pronto para gravar ${n} células.`, 'ok'); document.getElementById('btnGrav').disabled = false; }
  } catch (e) { log('✕ Erro: ' + e.message, 'err'); }
}

async function gravar() {
  document.getElementById('btnGrav').disabled = true; document.getElementById('btnConf').disabled = true;
  try {
    log('— Gravando — relendo a planilha antes...');
    const res = await analisar();
    if (res.some(r => r.st === 'diverge')) throw new Error('A planilha mudou desde a conferência. Clique em Conferir de novo.');
    const ap = res.filter(r => r.st === 'aplicar');
    for (const aba of ABAS) {
      const cells = ap.filter(r => r.c.aba === aba).map(r => ({ row: r.linha, col: r.c.col, expected: r.atual, value: r.c.para }));
      for (let k = 0; k < cells.length; k += 150) {
        const lote = cells.slice(k, k + 150);
        await call('update', { sheet: aba, cells: lote });
        log(`  ${aba}: ${lote.length} células gravadas`);
      }
    }
    log('Conferindo o que foi gravado...');
    const depois = await analisar();
    const falta = depois.filter(r => r.st !== 'ja');
    falta.forEach(r => log('NÃO CONFERE: ' + rot(r.c) + ' — ' + (r.msg || r.st), 'err'));
    if (falta.length) log('✕ Algumas correções não conferem. Me mande este registro.', 'err');
    else log(`✓ Concluído: ${depois.length} correções conferidas na planilha (${ap.length} gravadas agora).`, 'ok');
  } catch (e) { log('✕ Erro: ' + e.message, 'err'); }
  document.getElementById('btnConf').disabled = false;
}
</script>
